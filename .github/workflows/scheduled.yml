# SPDX-License-Identifier: Apache-2.0
name: Scheduled

# Checks that do not belong to one change:
#   - every night: vulnerabilities in dependencies, which become known without a commit
#     (pnpm audit).
#   - Wednesday and Saturday: every fuzz target for ten minutes in one job. The fuzzing here
#     draws its inputs anew every run, so every run looks somewhere else.
# Long fuzzing belongs to a release candidate, not to a date (release.yml).
# A failure opens an issue, or comments on the open one; main itself is never changed.
on:
  schedule:
    - cron: "5 2 * * *" # security, every night
    - cron: "29 3 * * 3,6" # fuzzing, Wednesday and Saturday
  workflow_dispatch:
    inputs:
      what:
        description: "security or fuzz"
        required: true
        default: security
        type: choice
        options: [security, fuzz]

permissions:
  contents: read

jobs:
  # The newest release branch gets the same check: it only gets patches and no dependency
  # updates, so a finding there is fixed like any other bug (RELEASING.md). While that branch
  # has no version yet (release candidates only), the one before it is still the published
  # one and is checked too.
  branches:
    name: Branches to check
    if: github.event.schedule == '5 2 * * *' || inputs.what == 'security'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      refs: ${{ steps.list.outputs.refs }}
    steps:
      - id: list
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY"
          branches=$(git ls-remote --heads "$url" 'release/*' |
            sed 's#.*refs/heads/##' | grep -E '^release/[0-9]+\.[0-9]+$' | sort -V || true)
          newest=$(tail -n 1 <<< "$branches")
          refs=(main)
          if [ -n "$newest" ]; then
            refs+=("$newest")
            if ! git ls-remote --tags "$url" "v${newest#release/}.*" | grep -qE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
              previous=$(sed '$d' <<< "$branches" | tail -n 1)
              [ -z "$previous" ] || refs+=("$previous")
            fi
          fi
          echo "refs=$(jq -cn '$ARGS.positional' --args "${refs[@]}")" >> "$GITHUB_OUTPUT"

  security:
    name: Security (pnpm audit), ${{ matrix.ref }}
    needs: branches
    if: github.event.schedule == '5 2 * * *' || inputs.what == 'security'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.branches.outputs.refs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm audit

  # One job, one target after the other: nobody waits for it, and it takes one of the
  # organization's 20 runners instead of one per target. A target that fails doesn't stop
  # the others.
  fuzz:
    name: Fuzz (every target for ten minutes)
    if: github.event.schedule == '29 3 * * 3,6' || inputs.what == 'fuzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          FUZZ_TIME: 600 # seconds per target
        run: |
          set -uo pipefail
          failed=""
          for target in test/fuzz/*.fuzz.ts; do
            echo "::group::$target"
            node --test "$target" || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi
      # A failure is written to fuzz-failures/ with its seed and path; keep it to reproduce
      # the failure.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: fuzz-failures/
          if-no-files-found: ignore

  report:
    name: Report a failure
    needs: [branches, security, fuzz]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Scheduled check failed: ${{ github.event.schedule == '5 2 * * *' && 'security' || 'fuzzing' }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed: $RUN"
          fi
