# SPDX-License-Identifier: Apache-2.0
name: Conformance report

# Runs mandate-conformance (the test tool of the specification tag in "homeMandateSpec" of
# package.json) against the harness at the tag of a published release and attaches the
# report to that release as conformance-report.json, with build provenance
# (gh attestation verify conformance-report.json --repo home-mandate/spec-ts).
# home-mandate.org shows a conformance class as passed only with such a report.
# Runs when a release is published, or by hand for an existing release (input: its tag).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release, e.g. v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conformance-report-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  run:
    name: Run mandate-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag"; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile

      - name: Run mandate-conformance
        run: |
          spec="$(node -p 'require("./package.json").homeMandateSpec')"
          case "$spec" in v[0-9]*) ;; *) echo "homeMandateSpec in package.json is not a tag: $spec"; exit 1 ;; esac
          go install "github.com/home-mandate/spec/cmd/mandate-conformance@$spec"
          "$(go env GOPATH)/bin/mandate-conformance" -report conformance-report.json \
            -classes evaluator,selection,signatures,audit,audit-anchored -exec node src/harness.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: conformance-report*.json
          if-no-files-found: error
          retention-days: 1

  # Without the code under test: only this job may sign and write to the release.
  publish:
    name: Attest and attach
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release asset
      id-token: write # the attestation's signing certificate
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conformance-report

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: conformance-report*.json

      # Never replaces an attached report; a re-run adds only what is missing.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attached=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for file in conformance-report*.json; do
            if grep -qxF "$file" <<< "$attached"; then echo "$file is already attached"; continue; fi
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
