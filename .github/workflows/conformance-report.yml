# SPDX-License-Identifier: Apache-2.0
name: Conformance report

# Runs mandate-conformance (the test tool of the specification tag in "homeMandateSpec" of
# package.json) against the harness at the tag of a draft release and attaches the report to
# that draft as conformance-report.json, with build provenance
# (gh attestation verify conformance-report.json --repo home-mandate/spec-ts).
# home-mandate.org shows a conformance class as passed only with such a report.
# Called by release.yml after the draft exists, or by hand for a draft that lacks the report
# (input: its tag). A published release is immutable: nothing can be attached to it.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a draft release, e.g. v0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conformance-report-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  run:
    name: Run mandate-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # Whether the draft exists is checked by the job that attaches: a draft is visible only
      # with write access, which this job doesn't get.
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile

      - name: Run mandate-conformance
        run: |
          spec="$(node -p 'require("./package.json").homeMandateSpec')"
          case "$spec" in v[0-9]*) ;; *) echo "homeMandateSpec in package.json is not a tag: $spec"; exit 1 ;; esac
          go install "github.com/home-mandate/spec/cmd/mandate-conformance@$spec"
          "$(go env GOPATH)/bin/mandate-conformance" -report conformance-report.json \
            -classes evaluator,selection,signatures,audit,audit-anchored -exec node src/harness.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: conformance-report*.json
          if-no-files-found: error
          retention-days: 1

  # Without the code under test: only this job may sign and write to the release.
  publish:
    name: Attest and attach
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release asset
      id-token: write # the attestation's signing certificate
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-report

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: conformance-report*.json

      # Never replaces an attached report; a re-run adds only what is missing.
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
          [ "$draft" = true ] || { echo "::error::$TAG is published; a report can only be attached to a draft"; exit 1; }
          attached=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for file in conformance-report*.json; do
            if grep -qxF "$file" <<< "$attached"; then echo "$file is already attached"; continue; fi
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
