# SPDX-License-Identifier: Apache-2.0
name: CI

# Type check, the conformance files against the library, and the test tool of the
# specification against the harness. SPEC_VERSION is the tag of mandate-spec whose
# files are in spec/.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SPEC_VERSION: v0.2.0-alpha.1

jobs:
  check:
    name: Type check, tests, conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: go install github.com/mandate-spec/mandate-spec/cmd/mandate-conformance@${SPEC_VERSION}
      - run: >
          "$(go env GOPATH)/bin/mandate-conformance" -report report.json
          -classes evaluator,selection,signatures,audit,audit-anchored
          -exec node src/harness.ts
