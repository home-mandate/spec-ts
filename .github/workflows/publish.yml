# SPDX-License-Identifier: Apache-2.0
name: Publish to npm

# Publishes @home-mandate/spec. release.yml starts it on the tag once the GitHub release is
# published (a release published with the workflow token starts no workflow by itself); by hand
# only for a published release whose npm publication failed (run this workflow on its tag).
# The tarball is built, packed and tested once, and exactly that file is published, with
# provenance that names this workflow and the tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before anything reaches npm, which cannot be taken back: the same guard as in release.yml
  # (where the tag stands, the pull request and its checks, a version is a release candidate
  # that passed), and the release of the tag is published. Here too, not only in release.yml:
  # npm's trusted publisher is bound to this file.
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the pull request the commit came from
      checks: read # its checks
      actions: read # the run of the release candidate a version stands on
    outputs:
      version: ${{ steps.verify.outputs.version }}
      base: ${{ steps.verify.outputs.base }}
    steps:
      - name: A tag, not a branch
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [ "$REF_TYPE" = tag ] || { echo "::error::run this workflow on a tag"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the branches' history and the tags, to check where the tag stands
          persist-credentials: false

      - id: verify
        uses: home-mandate/.github/actions/release-verify@f73af670bc516d6556a0203315b90c0c6554852f
        with:
          tag: ${{ github.ref_name }}
          release: published
          required-checks: |
            Type check and tests
            Conformance (
            Fuzz (

  package:
    name: Build and test the package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      BASE: ${{ needs.verify.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # package.json carries X.Y.Z. A release candidate is that commit with the tag's suffix:
      # the version is set here, before anything is built, tested or packed.
      - name: The version in package.json, and the suffix of a release candidate
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$BASE" ]; then
            echo "::error::package.json has version $version, the tag $BASE"; exit 1
          fi
          if [ "$VERSION" != "$BASE" ]; then npm pkg set "version=$VERSION"; fi
          echo "packing $(node -p 'require("./package.json").version')"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build, pack and install the package
        run: node scripts/install-package.ts "$RUNNER_TEMP/consumer"

      - name: Run mandate-conformance against the installed package
        run: |
          spec="$(node -p 'require("./package.json").homeMandateSpec')"
          case "$spec" in v[0-9]*) ;; *) echo "homeMandateSpec in package.json is not a tag: $spec"; exit 1 ;; esac
          go install "github.com/home-mandate/spec/cmd/mandate-conformance@$spec"
          "$(go env GOPATH)/bin/mandate-conformance" -report "$RUNNER_TEMP/report.json" \
            -classes evaluator,selection,signatures,audit,audit-anchored \
            -exec "$RUNNER_TEMP/consumer/node_modules/.bin/mandate-harness-ts"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/consumer/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Without a checkout and without the code under test: only this job may publish.
  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and the provenance statement
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Publish the tested tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          npm publish ./*.tgz --provenance --access public --tag "$dist_tag"
