# SPDX-License-Identifier: Apache-2.0
name: Publish to npm

# Publishes @home-mandate/spec. release.yml starts it on the tag once the GitHub release is
# published (a release published with the workflow token starts no workflow by itself); by hand
# only for a published release whose npm publication failed (run this workflow on its tag).
# The tarball is built, packed and tested once, and exactly that file is published, with
# provenance that names this workflow and the tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before anything reaches npm, which cannot be taken back: the tag must point to a commit on
  # main, for a patch on release/X.Y (.github/scripts/release-base.sh), that came from a pull
  # request into that branch whose checks all passed. Here too, not only in release.yml: npm's
  # trusted publisher is bound to this file.
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the pull request the commit came from
      checks: read # its checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the branches' history, to check where the tag points
          persist-credentials: false

      - name: Where the tag stands and the pull request's checks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base=$(bash .github/scripts/release-base.sh "$TAG" "$GITHUB_SHA")
          bash .github/scripts/pr-checks.sh "$base" "$GITHUB_SHA" "Type check and tests" "Conformance (" "Fuzz ("

  package:
    name: Build and test the package
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      # With read access only a published release is visible, not a draft.
      - name: Check the tag and the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag"; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Check the version against the tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::version $version in package.json does not match $TAG"; exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build, pack and install the package
        run: node scripts/install-package.ts "$RUNNER_TEMP/consumer"

      - name: Run mandate-conformance against the installed package
        run: |
          spec="$(node -p 'require("./package.json").homeMandateSpec')"
          case "$spec" in v[0-9]*) ;; *) echo "homeMandateSpec in package.json is not a tag: $spec"; exit 1 ;; esac
          go install "github.com/home-mandate/spec/cmd/mandate-conformance@$spec"
          "$(go env GOPATH)/bin/mandate-conformance" -report "$RUNNER_TEMP/report.json" \
            -classes evaluator,selection,signatures,audit,audit-anchored \
            -exec "$RUNNER_TEMP/consumer/node_modules/.bin/mandate-harness-ts"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/consumer/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Without a checkout and without the code under test: only this job may publish.
  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and the provenance statement
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Publish the tested tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          npm publish ./*.tgz --provenance --access public --tag "$dist_tag"
